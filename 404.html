<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <title>Ana Vitória Versos</title>
  <base href="/">
  <script>
    fetch("/index.html", { cache: "no-store" })
      .then(function (response) {
        return response.text();
      })
      .then(function (html) {
        document.open();
        document.write(html);
        document.close();
      });
  </script>
</head>
<body></body>
</html>
