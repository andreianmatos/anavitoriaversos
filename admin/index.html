<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,500;0,600;0,700;1,600&display=swap"
    rel="stylesheet"
  >
  <link rel="stylesheet" href="admin.css?v=47">
  <script src="config.js?v=5"></script>
  <script>
    (function () {
      var path = window.location.pathname;
      if (/\/admin$/i.test(path)) {
        window.location.replace(path + "/" + window.location.search + window.location.hash);
      }
    })();
  </script>
</head>
<body class="admin-page">
  <div class="admin-frame">
    <header class="admin-frame__bar">
      <a class="admin-bar__home" href="../index.html" aria-label="Site">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <line x1="12" y1="12" x2="12" y2="2" />
          <line x1="12" y1="12" x2="21.51" y2="8.91" />
          <line x1="12" y1="12" x2="17.88" y2="20.09" />
          <line x1="12" y1="12" x2="6.12" y2="20.09" />
          <line x1="12" y1="12" x2="2.49" y2="8.91" />
        </svg>
      </a>
      <h1 class="admin-frame__title">Admin</h1>
    </header>

    <div class="admin-frame__body">
      <div class="admin-shell">
    <section class="admin-session" id="admin-session" aria-live="polite">
      <p class="admin-status" id="admin-status" role="status"></p>
      <div class="admin-auth">
        <button type="button" class="admin-login-btn" id="admin-login" hidden>Login com GitHub</button>
        <button type="button" class="admin-link" id="admin-logout" hidden>Terminar sessão</button>
      </div>
    </section>

    <div class="admin-grid">
      <section class="admin-panel admin-panel--add" id="admin-upload" aria-label="Adicionar obra">
        <h2 class="admin-panel__title">Adicionar</h2>

        <input
          class="admin-file-input"
          type="file"
          id="admin-file"
          accept="image/png,image/jpeg,image/webp,image/gif"
          tabindex="-1"
          aria-hidden="true"
        >

        <fieldset class="admin-tipo" id="admin-tipo" aria-label="Tipo de publicação">
          <legend class="admin-visually-hidden">Tipo de publicação</legend>
          <div class="admin-tipo__choices">
            <label class="admin-tipo__choice">
              <input type="radio" name="admin-tipo" value="arquivo" checked>
              <span>Arquivo Geral</span>
            </label>
            <label class="admin-tipo__choice">
              <input type="radio" name="admin-tipo" value="pagina">
              <span>Página Específica</span>
            </label>
          </div>
        </fieldset>

        <div
          class="admin-drop"
          id="admin-drop"
          role="button"
          tabindex="0"
          aria-label="Escolher imagem"
        >
          <span class="admin-drop__action">Imagem</span>
          <span class="admin-drop__hint">Clica ou arrasta</span>
          <span class="admin-drop__name" id="admin-filename" aria-live="polite"></span>
        </div>

        <div class="admin-obra-fields" id="admin-obra-fields">
          <label class="admin-label">
            <span>Título</span>
            <input class="admin-input" type="text" id="admin-title" autocomplete="off" placeholder="Ex.: FRANGO">
          </label>

          <label class="admin-label">
            <span>Texto</span>
            <textarea
              class="admin-textarea"
              id="admin-text"
              rows="6"
              placeholder="Parágrafos separados por linha em branco"
            ></textarea>
          </label>
        </div>

        <div class="admin-pagina-wrap" id="admin-pagina-wrap" hidden>
          <select class="admin-input admin-select" id="admin-pagina" aria-label="Página da obra">
            <option value="">Escolhe a página…</option>
          </select>
        </div>

        <button type="button" class="admin-submit" id="admin-save">Publicar</button>
      </section>

      <section class="admin-panel admin-panel--remove" id="admin-remove" aria-label="Remover obra">
        <h2 class="admin-panel__title">Remover</h2>
        <ul class="admin-remove__list" id="admin-remove-list">
          <li class="admin-remove__empty">A carregar…</li>
        </ul>
      </section>
    </div>

      <aside class="admin-setup" id="admin-setup" hidden>
        <p>Falta configurar login em <code>admin/config.js</code> — ver <code>SETUP.md</code>.</p>
      </aside>
    </div>
  </div>

  <script src="admin.js?v=33"></script>
</body>
</html>
