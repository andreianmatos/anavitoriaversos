<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>Frango</title>
</head>
<body>
  <!-- Fragmento carregado por site.js na main (/Frango). Não é uma página à parte. -->
  <main class="frango">
    <header class="umbigo-hero frango-hero">
      <div class="umbigo-hero__stage frango-hero__stage">
        <h1 class="umbigo-work__title" data-lang-panel="pt">Frango</h1>
        <h1 class="umbigo-work__title" data-lang-panel="en" hidden>Frango</h1>
      </div>
    </header>

    <div class="umbigo-caixas frango-works">
      <figure>
        <img src="imagens/arquivo/frango.png" alt="Frango" data-archive-file="frango.png">
      </figure>
      <figure>
        <img src="imagens/arquivo/frango(1).png" alt="Frango" data-archive-file="frango(1).png">
      </figure>
    </div>

    <div class="umbigo-caixas frango-consequencias">
      <figure>
        <img src="imagens/arquivo/consequencias/frango fotograma.png" alt="Fotograma">
        <figcaption lang="pt" data-lang-panel="pt">Fotograma</figcaption>
        <figcaption lang="en" data-lang-panel="en" hidden>Film still</figcaption>
      </figure>
      <figure>
        <img src="imagens/arquivo/consequencias/frango-panfleto folha de sala frente.png" alt="Panfleto — frente">
        <figcaption lang="pt" data-lang-panel="pt">Panfleto — folha de sala (frente)</figcaption>
        <figcaption lang="en" data-lang-panel="en" hidden>Leaflet — front</figcaption>
      </figure>
      <figure>
        <img src="imagens/arquivo/consequencias/frango-panfleto folha de sala verso.jpg" alt="Panfleto — verso">
        <figcaption lang="pt" data-lang-panel="pt">Panfleto — folha de sala (verso)</figcaption>
        <figcaption lang="en" data-lang-panel="en" hidden>Leaflet — back</figcaption>
      </figure>
    </div>
  </main>
</body>
</html>
